name: Discover TV Registry Channels

on:
  schedule:
    # Daily at 9:23 AM UTC (2:53 PM IST) - see discover-liveradios.yml for the schedule rules. TRAI
    # republishes its permitted-channels PDF roughly monthly, so most runs find nothing new.
    - cron: '23 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  discover:
    runs-on: ubuntu-latest
    # No Playwright/browser involved (see the script's own docstring for why) - a plain PDF
    # fetch, one iptv-org channels.json/streams.json fetch (already small/fast elsewhere in this
    # repo), and a batch of media probes bounded by however many names go unmatched that month.
    timeout-minutes: 30

    steps:
      # Checks out the PRIVATE animeshahilya/akashvani repo, not this (public) repo - see
      # discover-liveradios.yml's identical step for the full reasoning on AKASHVANI_PAT.
      - name: Checkout private akashvani repo
        uses: actions/checkout@v7
        with:
          repository: animeshahilya/akashvani
          token: ${{ secrets.AKASHVANI_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/test_discover_registry_common.py tests/test_discover_tv_registry.py -v

      - name: Install discovery Python dependencies
        run: pip install -r requirements-discovery.txt

      - name: Run TV registry discovery
        run: python discover_tv_registry.py

      - name: Commit and push changes
        id: commit
        continue-on-error: true # let the retry step below get a chance before failing the job
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # No-ops cleanly if nothing new was found this run - git-auto-commit-action skips
          # committing on an unchanged working tree.
          commit_message: "chore: cross-check MIB/TRAI's TV channel registry against iptv-org for new channels"
          file_pattern: "manual_verified_tv.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      # Same transient-push-failure pattern as scrape.yml's own retry step.
      - name: Retry push on transient failure
        if: steps.commit.outcome == 'failure'
        run: |
          # Guards the same way scrape.yml's own retry step does, and for the same reason: this
          # step exists for a transient push failure, where the commit already succeeded locally.
          # A commit step that failed *before* committing leaves the tree dirty with nothing to
          # push, and a bare `git push` answers 0 to that - turning a run that committed nothing
          # into a green one. See scrape.yml's commit step for the day and a half of green runs
          # that shape actually cost.
          if [ -n "$(git status --porcelain -- manual_verified_tv.json)" ]; then
            echo "::error::The commit step failed without committing - manual_verified_tv.json is still uncommitted, so retrying the push cannot help and would report this run as green."
            git status --porcelain -- manual_verified_tv.json
            exit 1
          fi
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 20s..."
            sleep 20
            # A rejected push is usually the daily scrape having pushed meantime (09-20 failure):
            # retrying the same push can never succeed without rebasing onto it. This job only
            # touches manual_verified_*.json, which the scrape never writes, so it's conflict-free.
            # The runner has no git identity and a rebase re-creates commits, so it needs one; a
            # failed rebase is aborted so the next attempt is not left on a detached HEAD.
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" pull --rebase --autostash || git rebase --abort || true
          done
          echo "::error::Push failed after 3 retry attempts"
          exit 1
