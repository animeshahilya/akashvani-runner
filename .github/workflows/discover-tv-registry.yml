name: Discover TV Registry Channels

on:
  schedule:
    # Daily, second in this repo's five-workflow daily chain (see discover-liveradios.yml's own
    # schedule comment for the full reasoning). TRAI republishes its MIB-sourced permitted-channels
    # PDF roughly monthly (see discover_tv_registry.py's own docstring) so most daily runs just
    # re-fetch and re-diff against unchanged source data - an explicit tradeoff for a fully daily
    # schedule, not an oversight, and a cheap one since this job is a 30-minute-worst-case plain PDF
    # fetch with no Playwright/browser cost. Writes manual_verified_tv.json, a different file from
    # the manual_verified_radio.json trio (discover-liveradios.yml, discover-commercial-radio.yml,
    # discover-crs-registry.yml), but still pushes to the same private repo's main branch, so it
    # still needs its own clear slot: 9:00 AM UTC, after discover-liveradios.yml's own worst-case
    # window (3:00 AM UTC start + 340-minute timeout) clears at 8:40 AM UTC.
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  discover:
    runs-on: ubuntu-latest
    # No Playwright/browser involved (see the script's own docstring for why) - a plain PDF
    # fetch, one iptv-org channels.json/streams.json fetch (already small/fast elsewhere in this
    # repo), and a batch of media probes bounded by however many names go unmatched that month.
    timeout-minutes: 30

    steps:
      # Checks out the PRIVATE animeshahilya/akashvani repo, not this (public) repo - see
      # discover-liveradios.yml's identical step for the full reasoning on AKASHVANI_PAT.
      - name: Checkout private akashvani repo
        uses: actions/checkout@v7
        with:
          repository: animeshahilya/akashvani
          token: ${{ secrets.AKASHVANI_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/test_discover_tv_registry.py -v

      - name: Install discovery Python dependencies
        run: pip install -r requirements-discovery.txt

      - name: Run TV registry discovery
        run: python discover_tv_registry.py

      - name: Commit and push changes
        id: commit
        continue-on-error: true # let the retry step below get a chance before failing the job
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # No-ops cleanly if nothing new was found this run - git-auto-commit-action skips
          # committing on an unchanged working tree.
          commit_message: "chore: cross-check MIB/TRAI's TV channel registry against iptv-org for new channels"
          file_pattern: "manual_verified_tv.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      # Same transient-push-failure pattern as scrape.yml's own retry step.
      - name: Retry push on transient failure
        if: steps.commit.outcome == 'failure'
        run: |
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "::error::Push failed after 3 retry attempts"
          exit 1
