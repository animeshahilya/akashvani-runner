name: Daily Akashvani Scraper

on:
  schedule:
    # Once a day - 7:00 AM IST is 1:30 AM UTC (IST = UTC+5:30, no daylight saving) - GitHub
    # Actions cron is always UTC, there's no timezone field to set instead. Every candidate is
    # a fresh fetch every run; dead_stations.json/station_reliability.json only gate whether it
    # also gets a fresh network liveness probe this run (see partition_confidently_alive()/
    # partition_confidently_dead() in scraper/state.py) - a station repeatedly confirmed dead
    # settles into being probed every few days instead of daily, everything else gets a fresh
    # daily check. Unaffected by the discover-*.yml workflows' own 2026-08-27 move to weekly,
    # one-per-day-of-week slots in this repo - this stays daily on purpose, because unlike source
    # discovery, stream liveness really does change day to day. It also writes
    # stations.json/tv_channels.json/etc, none of which those workflows touch.
    - cron: '30 1 * * *' # 7:00 AM IST / 1:30 AM UTC
    # No pull_request trigger here (unlike the private repo's own test.yml) - this repo holds only
    # workflow definitions, so there's never a PR here with real scraper-code changes to test
    # against. The `test` job below still runs before every scheduled/manual scrape as a pre-flight
    # gate (see its own comment), just never against a PR diff.
  workflow_dispatch: # Allow manual triggering

jobs:
  test:
    # Runs before every scheduled/manual scrape, as a gate on scrape-and-update below - a
    # regression in the pure parsing/dedup logic blocks the daily auto-commit instead of only
    # being discovered when the schedule silently misbehaves. The private animeshahilya/akashvani
    # repo has its own separate test.yml that runs this same suite on every push/PR to that repo's
    # actual code - this is a second, independent run of it, gating the scrape itself rather than
    # the code change.
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Normally ~15s - bounds a hung dependency install/test run.
    steps:
      # Checks out the PRIVATE animeshahilya/akashvani repo, not this (public) repo - see
      # discover-liveradios.yml's identical step for the full reasoning on AKASHVANI_PAT.
      - name: Checkout private akashvani repo
        uses: actions/checkout@v7
        with:
          repository: animeshahilya/akashvani
          token: ${{ secrets.AKASHVANI_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Type gate for the scraper package - mypy on scraper/ (clean, verified against mypy 2.3.1
      # and Python 3.12). Runs after the tests so a pure parse/dedup regression fails the run
      # first with the more specific error, but a green test suite alone no longer clears a
      # type regression introduced by the same change. The types-requests stub package (in
      # requirements-dev.txt) is required here, not optional: scraper/utils.py type-annotates
      # requests.Session parameters, and without the stubs mypy fails the whole run on
      # import-untyped for requests alone.
      - name: Run mypy type check
        run: mypy scraper/

  scrape-and-update:
    needs: test
    runs-on: ubuntu-latest
    # Was 15 (~3 minutes normally) before Junguler/South Asian IPTV joined as sources - their
    # raw candidate counts (tens of thousands of stations/channels before dedup) pushed the
    # validation pass alone past 15 minutes on its own, verified live, before this job's own
    # candidate volume even fully validated once. 40 leaves real margin above that while still
    # being a real bound: without one, a genuinely hung probe (a socket edge case outrunning
    # STREAM_CONNECT_TIMEOUT/STREAM_READ_TIMEOUT) could run for GitHub's full 6-hour job default -
    # and because cancel-in-progress is false below, every later scheduled/manual run would then
    # queue behind it indefinitely instead of the hang failing fast.
    timeout-minutes: 40
    # A manual workflow_dispatch fired right as the scheduled run starts would otherwise race it,
    # both trying to commit/push to the same branch. Queuing the second run instead of letting
    # them race is safer than cancelling one mid-scrape, since is_stream_working()'s daily counts
    # and dead_stations.json's pruning both assume a run completes as one atomic unit.
    concurrency:
      group: scrape-and-update
      cancel-in-progress: false

    # Named once so the commit step and the guard on its retry step can never disagree about which
    # files this run was supposed to persist. Must contain no gitignored path - see the commit
    # step's own comment for what happens when it does.
    env:
      COMMITTED_STATE_FILES: >-
        stations.json tv_channels.json dead_stations.json junguler_file_stats.json
        host_reliability.json station_reliability.json source_reliability.json
        tv_source_baseline.json stream_self_report.json

    steps:
      # Checks out the PRIVATE animeshahilya/akashvani repo, not this (public) repo - see
      # discover-liveradios.yml's identical step for the full reasoning on AKASHVANI_PAT.
      - name: Checkout private akashvani repo
        uses: actions/checkout@v7
        with:
          repository: animeshahilya/akashvani
          token: ${{ secrets.AKASHVANI_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # fetch_cache.json used to be carried between runs by committing it, alongside the state
      # files below. It cannot be: it holds each cached URL's full response *body* (see
      # fetch_text_if_modified() in scraper/utils.py - a 304 carries no body of its own, so the
      # cache has to keep one or the conditional GET saves nothing), which put a real 84 MB blob
      # into the repo on every daily commit until it was gitignored on 2026-08-24. Actions cache
      # is where a large, entirely regenerable, cross-run blob belongs. Without this the scraper
      # starts every run from an empty cache, which quietly turns every conditional GET back into
      # a plain unconditional one - the feature still runs, it just never gets to do anything.
      # Keyed by run_id with a prefix restore-key so each run restores the newest previous cache
      # and saves its own updated one back (the standard rolling-cache shape - a fixed key would
      # be written once and then never updated again).
      - name: Restore the conditional-fetch cache
        uses: actions/cache@v4
        with:
          path: fetch_cache.json
          key: fetch-cache-${{ github.run_id }}
          restore-keys: |
            fetch-cache-

      - name: Run scraper script
        id: scrape
        run: python scrape_radio.py

      # The `test` job above runs the same suite, but necessarily against the *checked-out*
      # stations.json/tv_channels.json - i.e. the previous run's output. That makes it useless as
      # a guard on the data this run just produced: a malformed entry published today passes
      # today's gate and then fails every subsequent run, blocking the scrape until someone edits
      # the JSON by hand (verified live 2026-08-24: runs 32700836004 and 32705674584 both died
      # this way, on a stream_url the 02:45 run had already committed hours earlier). Re-running
      # only the published-data integrity tests here, after the scrape and before the commit,
      # makes a bad publish fail its own run instead of the next one - the working tree is simply
      # not committed. pytest-only (no mypy, no network fetches): the code gate already passed
      # above, this is purely about the freshly written files.
      - name: Check freshly generated data before committing
        run: pip install -r requirements-dev.txt && pytest tests/test_published_data_integrity.py -v

      # Both push-retry steps below need identical logic, and this file's own history shows what
      # happens when near-identical blocks drift apart (the guard added to one of them had to be
      # copied into the other by hand). Written once here, into $RUNNER_TEMP so it is reachable
      # whichever repo's working directory a step runs in - the akashvani checkout replaces the
      # workspace root, so a script committed in THIS repo would not be on disk at all.
      - name: Prepare the shared push helper
        run: |
          cat > "$RUNNER_TEMP/push_with_rebase.sh" <<'HELPER'
          # push_with_rebase <label> - pushes the current branch, distinguishing the two failure
          # modes that actually happen here instead of treating every failure as transient.
          #
          #  * TRANSIENT (a GitHub-side 500, "remote: fatal error in commit_refs") - verified live
          #    on both of these steps. Worth sleeping and retrying: the same push will work.
          #
          #  * NON-FAST-FORWARD - the remote branch moved while this job was working. Retrying is
          #    pointless (it is not a blip, the rejection is deterministic) and used to burn three
          #    attempts and 60 seconds before failing the run and discarding everything the scrape
          #    had produced. Verified live 2026-08-26, run 32932382449: a source-code push landed
          #    on akashvani/master during the ~13-minute scrape, and a complete, healthy run (+187
          #    /-145 stations, +457/-160 channels) was thrown away over it. Rebasing this run's
          #    data commit onto the updated remote and pushing again is safe and is what a person
          #    would do by hand: this job only ever commits generated data files, and the
          #    concurrency group above already guarantees no other scrape is writing them.
          #
          # A rebase that genuinely conflicts is NOT forced past - that would mean something else
          # really did change the same generated files, which this job cannot resolve correctly,
          # so it fails loudly with both sides intact.
          push_with_rebase() {
            local label="$1"
            local err="$RUNNER_TEMP/push_err.txt"
            # Rebase replays commits, which needs a committer identity even though it keeps each
            # commit's original author.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3; do
              if git push 2>"$err"; then
                return 0
              fi
              cat "$err"
              if grep -qiE 'non-fast-forward|fetch first|behind its remote' "$err"; then
                echo "$label: the remote moved while this run was working - rebasing onto it."
                if git pull --rebase --autostash; then
                  # Deliberately no sleep: this was never a transient failure, and the very next
                  # push is now a fast-forward.
                  continue
                fi
                git rebase --abort || true
                echo "::error::$label: rebase onto the updated remote conflicted, which means something else changed the same generated files this run produced. Not forcing past it - both sides are left intact."
                return 1
              fi
              echo "$label: push attempt $attempt failed and looks transient, retrying in 20s..."
              sleep 20
            done
            echo "::error::$label: push failed after 3 attempts."
            return 1
          }
          HELPER
          echo "Wrote $RUNNER_TEMP/push_with_rebase.sh"

      - name: Commit and push changes
        id: commit
        continue-on-error: true # let the retry step below get a chance before failing the job
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # added/removed/added_tv/removed_tv come from the scrape step's own GITHUB_OUTPUT (see
          # write_github_output() in scrape_radio.py) - empty if that step didn't run (e.g. it
          # exited 1 with no working stations or channels at all), in which case there's nothing
          # to commit anyway since git-auto-commit-action no-ops on an unchanged working tree.
          commit_message: "chore: update akashvani stations and channels (+${{ steps.scrape.outputs.added }}/-${{ steps.scrape.outputs.removed }} stations, +${{ steps.scrape.outputs.added_tv }}/-${{ steps.scrape.outputs.removed_tv }} channels)"
          # station_reliability.json/source_reliability.json (consecutive-success streaks / per-
          # source success rate - see partition_confidently_alive() in scraper/state.py) and
          # host_reliability.json's own extended probes/transient_failures counters (see
          # build_host_timeout_overrides()) all need to persist across runs the same ephemeral-
          # GitHub-Actions-runner reasoning dead_stations.json already documents, as does
          # tv_source_baseline.json (TV_SOURCE_BASELINE_PATH). COMMITTED_STATE_FILES is the only
          # thing that actually enforces that: a file missing from it is computed correctly every
          # run and silently thrown away every run, with no error anywhere (verified live
          # 2026-08-20 - two were missing from the run that introduced them, discarding every
          # run's real work until that fix). Always grep it before adding a new state file.
          #
          # The opposite mistake costs just as much and was live here for a day and a half:
          # fetch_cache.json stayed in this list after being gitignored on 2026-08-24, and
          # `git add` exits 1 on an ignored path, which aborts this whole action before it commits
          # anything at all. So from that commit until 2026-08-25, every run discarded all eight
          # files rather than just the one - the private stations.json sat frozen while the
          # confident-alive/confident-dead skip windows, the Junguler low-yield stats and the TV
          # source baseline were all still being read from, and never advanced past, their
          # 2026-08-24 snapshot. Never list a gitignored path here; the cache step above is where
          # fetch_cache.json lives now.
          file_pattern: ${{ env.COMMITTED_STATE_FILES }}
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      # These bare `git push`es still authenticate as the checkout step's token even on
      # actions/checkout@v6+, which moved the persisted credential out of .git/config and into a
      # separate file under $RUNNER_TEMP - the local git config still points at it, so any run
      # step in the same job pushes exactly as before. (Only a Docker container action would
      # need anything extra, and nothing here is one.)
      # Same transient-push-failure pattern as the akashvani-data mirror push below (see that
      # step's comment) - now verified live on this step too (2026-08-13 runs 31710984381 and
      # an earlier one), where git-auto-commit-action's push failed with a transient GitHub-side
      # "Internal Server Error" even though the commit itself had already succeeded locally.
      # Only the push is retried, never a second commit attempt - if the commit succeeded, the
      # working tree is already clean, so re-running the commit action would just no-op anyway.
      #
      # "If the commit succeeded" is the load-bearing half, and it is now checked rather than
      # assumed. A commit step that failed *before* committing leaves the tree dirty with nothing
      # to push, and a bare `git push` answers 0 to that - so this step, whose whole purpose is to
      # rescue the run, would instead report a run that committed nothing as green. Not
      # hypothetical: that is exactly what hid the gitignored-file_pattern breakage described
      # above behind a day and a half of green runs, from 2026-08-24 until 2026-08-25.
      - name: Retry push to akashvani repo on transient failure
        if: steps.commit.outcome == 'failure'
        run: |
          if [ -n "$(git status --porcelain -- $COMMITTED_STATE_FILES)" ]; then
            echo "::error::The commit step failed without committing - the files below are still uncommitted, so retrying the push cannot help and would report this run as green."
            git status --porcelain -- $COMMITTED_STATE_FILES
            exit 1
          fi
          source "$RUNNER_TEMP/push_with_rebase.sh"
          push_with_rebase "akashvani"

      # This repo (akashvani-runner) holds only workflow definitions; animeshahilya/akashvani holds
      # the scraper's source (private, checked out above); animeshahilya/akashvani-data is a third,
      # deliberately public repo holding nothing but the two published JSON files, so the Tarang
      # app can keep fetching them unauthenticated (no token/proxy needed in the app) even though
      # neither of the other two repos is public. DATA_REPO_TOKEN needs write access to
      # akashvani-data only (Settings -> Secrets and variables -> Actions on *this* repo, not the
      # private akashvani repo where it used to live).
      - name: Checkout public data repo
        uses: actions/checkout@v7
        with:
          repository: animeshahilya/akashvani-data
          path: akashvani-data
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Mirror published data into the public repo
        run: cp stations.json tv_channels.json akashvani-data/

      - name: Commit and push mirrored data
        id: mirror_commit
        continue-on-error: true # let the retry step below get a chance before failing the job
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: akashvani-data
          commit_message: "chore: sync from animeshahilya/akashvani (+${{ steps.scrape.outputs.added }}/-${{ steps.scrape.outputs.removed }} stations, +${{ steps.scrape.outputs.added_tv }}/-${{ steps.scrape.outputs.removed_tv }} channels)"
          file_pattern: "stations.json tv_channels.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      # git-auto-commit-action above makes its commit locally and then pushes in the same step -
      # verified live (2026-08-11 run 31455151850) that the push half can fail on its own
      # ("remote: fatal error in commit_refs", a transient GitHub-side error, not a real
      # conflict: nothing else ever pushes to akashvani-data except this same job, and
      # scrape-and-update is already concurrency-locked above so two runs can't race each other
      # here) while the commit itself already succeeded. Left unretried, that failure mode used
      # to leave the app-facing mirror stale until the next scheduled run (or a manual
      # workflow_dispatch) happened to catch it back up, up to 24 hours later. Only the push is
      # retried, never a second commit attempt - the working tree is already clean at this point,
      # so re-running the commit action would just no-op anyway.
      - name: Retry push to public data repo on transient failure
        if: steps.mirror_commit.outcome == 'failure'
        working-directory: akashvani-data
        run: |
          # Same guard, same reasoning as the private-repo retry step above.
          if [ -n "$(git status --porcelain -- stations.json tv_channels.json)" ]; then
            echo "::error::The mirror commit step failed without committing - the files below are still uncommitted, so retrying the push cannot help and would report this run as green."
            git status --porcelain -- stations.json tv_channels.json
            exit 1
          fi
          source "$RUNNER_TEMP/push_with_rebase.sh"
          push_with_rebase "akashvani-data"

      # A scrape is ~13 minutes of real network work whose whole output is these files, and until
      # now any failure after the scrape (the push rejection in run 32932382449, a bad-data gate,
      # a runner timeout) destroyed all of it - the runner is torn down and the next run starts
      # from the last committed state. The rebase handling above should stop the common case, but
      # a run that fails anyway is now recoverable by hand instead of simply gone. Kept short:
      # this is a rescue copy, not an archive, and the next successful run supersedes it.
      - name: Keep this run's generated data when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: akashvani-data-${{ github.run_id }}
          path: |
            stations.json
            tv_channels.json
            dead_stations.json
            junguler_file_stats.json
            host_reliability.json
            station_reliability.json
            source_reliability.json
            tv_source_baseline.json
            stream_self_report.json
          if-no-files-found: warn
          retention-days: 7
